name: Build Veilborn Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download files
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Extract ZIP
        run: |
          unzip -q veilborn_the_island_fabric_1.20.1.zip -d mod

      - name: Find project
        run: |
          find mod -name build.gradle -exec dirname {} \;

      - name: Build
        run: |
          PROJECT=$(dirname "$(find mod -name build.gradle | head -1)")
          cd "$PROJECT"
          gradle build --no-daemon

      - name: Get JAR
        uses: actions/upload-artifact@v4
        with:
          name: Veilborn-JAR
          path: mod/**/build/libs/*.jar
